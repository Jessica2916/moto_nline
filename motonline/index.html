<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login e cadastro do app Motonline, com segurança e visual moderno.">
    <link rel="stylesheet" href="index.css">
    <title>App Motonline</title>
</head>
<body>
    <main class="container" id="loginSection">
        <div class="logo">
            <img src="images/futurista.png" alt="Logo Motonline">
        </div>
        <h1>Bem-vindo ao <span class="neon">Motonline</span></h1>
        <form id="loginForm">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>
            <p><a href="#" id="forgot">Esqueceu a senha?</a></p>
            <p id="forgotSenha"></p>

            <button type="submit">Entrar</button>
        </form>
        <p class="login-link" id="mensagem">Não tem uma conta?<a href="#" id="go-to-signup"> Cadastre-se</a></p>
    </main>
    <main class="container hidden" id="signupSection">
        <div class="logo">
            <img src="images/futurista.png" alt="Logo Motonline">
        </div>
        <h1>Crie <span class="neon"> sua conta</span></h1>
        <form id="cadastroForm">
            <label for="name">Nome:</label>
            <input type="text" name="text" id="name" placeholder="Digite seu nome completo" required>

            <label for="novoUsuario">Usuário:</label>
            <input type="text" id="novoUsuario" placeholder="Novo usuário" required>

            <label for="novaSenha">Senha:</label>
            <input type="password" id="novaSenha" placeholder="Digite uma senha" required>

            <button type="submit">Cadastrar</button>
        </form>
        <p class="login-link">Já tem conta?<a href="#" id="go-to-login"> Fazer login</a></p>
        <p id="mensagemCadastro"></p>
    </main>
    <script src="index.js"></script>
</body>
</html>
